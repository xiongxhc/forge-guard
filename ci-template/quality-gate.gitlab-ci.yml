# ============================================================
# quality-gate — forge-guard lane 2 (one copy, all repos)
#
# Fails the MR pipeline when the MR contains feature work
# (feat: commits, or 3+ non-test source files) with zero
# test-file changes. Escape hatch: a "Gate-Skip: <reason>"
# commit trailer passes the gate and prints a warning in the CI job log.
# No automatic Feishu bypass alert is implemented.
#
# Minimal consumer .gitlab-ci.yml addition:
#
#   include:
#     - project: your-group/ci-tools
#       ref: <full-reviewed-ci-tools-commit-sha>
#       file: ci/quality-gate.gitlab-ci.yml
#
# Also set the three QUALITY_GATE_TOOL_* variables below in the consumer job.
# Full package publication, MR rules, permissions and verification instructions:
# docs/quality-gate-setup.md in the forge-guard repository.
#
# Consumers whose pipeline lacks a `test` stage: override
# `stage:` (same convention as mcp-drift), e.g.
#
#   quality-gate:
#     stage: check
#
# (.pre is NOT used on purpose: GitLab refuses to create a
# pipeline containing only .pre/.post jobs, and in most repos
# this gate is the only merge_request_event job.)
#
# check_mr.py is
# fetched at job time from THIS project's generic package
# registry via CI_JOB_TOKEN — each consumer project must be on
# ci-tools' job-token allowlist (Settings → CI/CD → Job token
# permissions, or API projects/<ci-tools project id>/job_token_scope/allowlist).
# ============================================================
quality-gate:
  stage: test
  image: alpine:3.20
  variables:
    QUALITY_GATE_TOOL_PROJECT: "<ci-tools project id>"  # your-group/ci-tools
    QUALITY_GATE_TOOL_REF: "<full-reviewed-ci-tools-commit-sha>"
    QUALITY_GATE_TOOL_SHA256: "<sha256-of-check_mr.py-at-that-commit>"
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - apk add --no-cache git python3 curl ca-certificates >/dev/null
    - |
      # Use system trust, or the explicit CA supplied by the runner. Never -k.
      set --
      if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ]; then
        test -r "$CI_SERVER_TLS_CA_FILE" || { echo "Runner CA file is unreadable"; exit 1; }
        set -- --cacert "$CI_SERVER_TLS_CA_FILE"
      fi
      URL="$CI_API_V4_URL/projects/$QUALITY_GATE_TOOL_PROJECT/packages/generic/quality-gate/$QUALITY_GATE_TOOL_REF/check_mr.py"
      code=$(curl --silent --show-error "$@" --header "JOB-TOKEN: $CI_JOB_TOKEN" -w "%{http_code}" -o check_mr.py "$URL") || exit 1
      if [ "$code" != "200" ]; then
        echo "quality-gate tool fetch FAILED: HTTP $code from $URL"
        echo "Check package publication, allowlist and triggering user's ci-tools permissions."
        exit 1
      fi
      printf '%s  check_mr.py\n' "$QUALITY_GATE_TOOL_SHA256" | sha256sum -c - || exit 1
      echo "verified check_mr.py ($(wc -c < check_mr.py) bytes, ref $QUALITY_GATE_TOOL_REF)"
    # No extra git network calls: the diff base SHA is an ancestor of the MR head,
    # so the full clone (GIT_DEPTH 0) already contains it.
    - python3 check_mr.py "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
